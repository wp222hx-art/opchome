<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPC 管理平台 · 一人公司学习与运营操作系统</title>
  <meta name="description" content="OPC社区一人公司学习与运营一体化平台 - 配套《OPC社区运营手册V2.0》、《OPC培训课程体系V2.0》">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- 关键：先加载 ES Module（注册 window.app），加载完成后再启动 Alpine -->
  <script type="module">
    import('/js/app.js').then(() => {
      // app.js 已挂载 window.app，再动态注入 Alpine
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js';
      document.head.appendChild(s);
    }).catch(err => {
      console.error('[OPC] 应用脚本加载失败:', err);
      document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center;"><h2>加载失败</h2><pre style="text-align:left;background:#f5f5f5;padding:12px;border-radius:6px;">' + err.message + '</pre></div>';
    });
  </script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='700' fill='white' text-anchor='middle' font-family='sans-serif'%3EO%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="app" x-data="app()" x-init="init()" x-cloak>

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar" :class="{collapsed: sidebarCollapsed, open: mobileOpen}">
    <div class="sidebar-brand">
      <div class="logo">O</div>
      <div class="sidebar-title">
        OPC 管理平台
        <div class="sub">One Person Company OS</div>
      </div>
    </div>

    <!-- 学习端导航 -->
    <div class="sidebar-section" x-show="mode==='learning'">
      <div class="sidebar-section-title">学习中心</div>
      <div class="nav-item" :class="{active: page==='dashboard'}" @click="go('dashboard')">
        <i class="fas fa-gauge-high"></i><span class="nav-label">学习仪表盘</span>
      </div>
      <div class="nav-item" :class="{active: page==='courses'}" @click="go('courses')">
        <i class="fas fa-graduation-cap"></i><span class="nav-label">课程体系</span>
      </div>
      <div class="nav-item" :class="{active: page==='tracks'}" @click="go('tracks')">
        <i class="fas fa-route"></i><span class="nav-label">8大行业赛道</span>
      </div>
      <div class="nav-item" :class="{active: page==='ailab'}" @click="go('ailab')">
        <i class="fas fa-robot"></i><span class="nav-label">AI智能体工坊</span>
      </div>
      <div class="nav-item" :class="{active: page==='prompts'}" @click="go('prompts')">
        <i class="fas fa-magic-wand-sparkles"></i><span class="nav-label">行业提示词库</span>
      </div>
      <div class="nav-item" :class="{active: page==='progress'}" @click="go('progress')">
        <i class="fas fa-chart-line"></i><span class="nav-label">学习进度</span>
      </div>
      <div class="nav-item" :class="{active: page==='achievements'}" @click="go('achievements')">
        <i class="fas fa-trophy"></i><span class="nav-label">成就徽章</span>
      </div>
    </div>

    <!-- 运营端导航 -->
    <div class="sidebar-section" x-show="mode==='ops'">
      <div class="sidebar-section-title">运营总览</div>
      <div class="nav-item" :class="{active: page==='ops-overview'}" @click="go('ops-overview')">
        <i class="fas fa-tachometer-alt"></i><span class="nav-label">运营总览</span>
      </div>
      <div class="nav-item" :class="{active: page==='members'}" @click="go('members')">
        <i class="fas fa-users"></i><span class="nav-label">会员管理</span>
      </div>
      <div class="nav-item" :class="{active: page==='venues'}" @click="go('venues')">
        <i class="fas fa-building"></i><span class="nav-label">场地预约</span>
      </div>
      <div class="nav-item" :class="{active: page==='events'}" @click="go('events')">
        <i class="fas fa-calendar-check"></i><span class="nav-label">活动管理</span>
      </div>
      <div class="nav-item" :class="{active: page==='equipment'}" @click="go('equipment')">
        <i class="fas fa-camera"></i><span class="nav-label">设备台账</span>
      </div>

      <div class="sidebar-section-title" style="margin-top:14px;">运营管理</div>
      <div class="nav-item" :class="{active: page==='sop'}" @click="go('sop')">
        <i class="fas fa-clipboard-check"></i><span class="nav-label">SOP执行</span>
      </div>
      <div class="nav-item" :class="{active: page==='tickets'}" @click="go('tickets')">
        <i class="fas fa-ticket"></i><span class="nav-label">工单/通知</span>
      </div>
      <div class="nav-item" :class="{active: page==='emergency'}" @click="go('emergency')">
        <i class="fas fa-triangle-exclamation"></i><span class="nav-label">应急预案</span>
      </div>

      <div class="sidebar-section-title" style="margin-top:14px;">数据决策</div>
      <div class="nav-item" :class="{active: page==='finance'}" @click="go('finance')">
        <i class="fas fa-coins"></i><span class="nav-label">财务看板</span>
      </div>
      <div class="nav-item" :class="{active: page==='kpi'}" @click="go('kpi')">
        <i class="fas fa-bullseye"></i><span class="nav-label">KPI考核</span>
      </div>
    </div>

    <!-- 用户卡片 -->
    <div class="user-card">
      <div class="user-avatar">U</div>
      <div class="user-info">
        <div class="name">OPC 创作者</div>
        <div class="level" x-text="userLevel"></div>
      </div>
    </div>
  </aside>

  <!-- ============ 主内容 ============ -->
  <div class="main">
    <!-- 顶部 -->
    <div class="topbar">
      <button class="toggle-btn" @click="toggleSidebar()" title="折叠/展开">
        <i class="fas fa-bars"></i>
      </button>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="搜索课程、会员、场地、活动..." x-model="search">
      </div>

      <div class="topbar-right">
        <div class="mode-switch">
          <button :class="{active: mode==='learning'}" @click="switchMode('learning')">
            <i class="fas fa-graduation-cap"></i> 学习端
          </button>
          <button :class="{active: mode==='ops'}" @click="switchMode('ops')">
            <i class="fas fa-cogs"></i> 运营端
          </button>
        </div>
        <button class="icon-btn" @click="toggleTheme()" title="切换主题">
          <i class="fas" :class="theme==='dark' ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <button class="icon-btn" title="通知">
          <i class="fas fa-bell"></i>
        </button>
      </div>
    </div>

    <!-- 页面容器 -->
    <main class="content fade-in" :key="page">
      <!-- 各页面通过 templates/views 渲染 -->
      <div id="view-root"></div>
    </main>
  </div>
</div>

<style>[x-cloak]{display:none!important;}</style>
</body>
</html>
